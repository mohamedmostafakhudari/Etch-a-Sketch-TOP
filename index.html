<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etch A Sketch</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <header class="header">
    <div class="logo">
      <h1>Etch A Sketch</h1>
    </div>
    <div class="buttons-wrapper">
      <button class="btn" id="clear-btn">Clear</button>
    <button class="btn" id="options-btn"  popovertarget="options-menu">Options</button>
    <div class="options-menu" id="options-menu" popover>
      <h3>Settings</h3>
      <ul>
        <li class="options-item">
          <label for="hide-grid">
            <input type="checkbox" name="hide-grid" id="hide-grid">
            Hide grid
          </label>
        </li>
        <li class="options-item">
          <label for="canvas-size">Grid size: <span id="canvas-size-text" class="canvas-size-text">16</span>px</label>
          <input type="range" name="canvas-size" id="canvas-size" min="10" max="100" value ="16">
        </li>
        <li class="options-item">
          <div class="color-picker-wrapper">
            <label for="color-picker">Color:</label>
            <input type="color" name="color-picker" id="color-picker" class="color-picker">
          </div>
        </li>
        <li class="options-item">
          <label for="random-color-mode">
            <input type="checkbox" name="random-color-mode" id="random-color-mode">
            Random color mode
          </label>
        </li>
        <li class="options-item">
          <label for="darkening-mode">
            <input type="checkbox" name="darkening-mode" id="darkening-mode">
            Darkening mode
          </label>
        </li>
      </ul>
    </div>
    </div>
  </header>
  <main>
    <div class="canvas-container">
      <div class="canvas-board" id="canvas-board">

      </div>
    </div>
  </main>
</body>
</html>
